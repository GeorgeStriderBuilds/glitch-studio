<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitch Studio</title>
<style>
:root{--bg:#f4f2f7;--surface:#fff;--ink:#1b1830;--mute:#6a6683;--line:#dcd8e8;--accent:#7a2cf0;--accent-ink:#fff;--chk1:#e6e3ee;--chk2:#f6f5fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121021;--surface:#1c1932;--ink:#efecff;--mute:#9a96b8;--line:#322e52;--accent:#a67bff;--accent-ink:#14102a;--chk1:#26223f;--chk2:#1a1730}}
:root[data-theme="dark"]{--bg:#121021;--surface:#1c1932;--ink:#efecff;--mute:#9a96b8;--line:#322e52;--accent:#a67bff;--accent-ink:#14102a;--chk1:#26223f;--chk2:#1a1730}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bar h1{font-size:18px;margin:0;flex:1}
.stage{display:flex;justify-content:center;align-items:center;min-height:120px;border-radius:12px;overflow:hidden;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/16px 16px}
canvas{display:block;max-width:100%;max-height:40vh;width:auto;height:auto}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{flex:1 1 30%;padding:0 6px}
.row{margin:18px 0 6px}
.trk{position:relative;height:36px;touch-action:pan-y}
.trk::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--line)}
.fill{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--accent);pointer-events:none}
.thumb{position:absolute;top:0;width:36px;height:36px;border-radius:50%;background:var(--accent);border:5px solid var(--surface);box-shadow:0 0 0 1px var(--line);touch-action:none;cursor:grab;outline:none}
.thumb.act{box-shadow:0 0 0 7px rgba(122,44,240,.25)}
.thumb:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.row label{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.row label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:36px;accent-color:var(--accent);margin:0;touch-action:pan-y}
.acts{display:flex;gap:8px}.acts button{flex:1}
#msg{font-size:13px;color:var(--mute);min-height:18px;margin-top:6px}
[hidden]{display:none!important}
#pick,#pick2{position:relative;overflow:hidden;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
#pick2{flex:1;justify-content:center}
#cmp{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;width:100%;padding:0 10px;margin-top:6px}
#pick input,#pick2 input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <h1>Glitch Studio</h1>
    <label id="pick">Choose photo<input type="file" id="file" accept="image/*"></label>
  </div>
  <div class="stage" id="stage"><div class="empty" id="empty">Pick a photo to start.<br>Everything stays on your phone.</div><canvas id="cv" hidden></canvas></div>
</div>
<main>
  <div class="acts" style="margin-bottom:12px">
    <button id="undo" disabled>Undo</button>
    <button id="reset">Reset</button>
    <button class="pri" id="save">Save image</button>
  </div>
  <div class="acts" style="margin-bottom:12px"><button id="rand">Randomize</button><button id="cmp">Hold to compare</button></div>
  <div id="msg"></div>
  <div id="fbx" hidden style="margin-bottom:12px"><img id="fb" alt="Your finished image" style="width:100%;border-radius:10px"></div>
  <section><h2>Mirror</h2>
    <div class="seg" id="mirror"></div>
    <div id="g-mirror"></div>
    <div class="seg" id="mcm" style="margin-top:8px"></div>
  </section>
  <section><h2>Kaleidoscope</h2><div id="g-kal"></div></section>
  <section><h2>Datamosh-style</h2>
    <div id="g-mosh"></div>
    <div class="seg" id="sd" style="margin-top:8px"></div>
    <div id="g-mosh2"></div>
    <button id="shuffle" style="width:100%;margin-top:10px">Reshuffle randomness</button>
  </section>
  <section><h2>Effects</h2><div id="g-fx"></div><div class="seg" id="inv" style="margin-top:10px"></div></section>
  <section><h2>Overlay photo</h2>
    <div class="acts"><label id="pick2">Choose overlay photo<input type="file" id="file2" accept="image/*"></label><button id="rmov">Remove</button></div>
    <div class="row"><label><span>Blend mode</span></label>
    <select id="blend"><option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft light</option><option value="hard-light">Hard light</option><option value="difference">Difference</option><option value="exclusion">Exclusion</option><option value="lighten">Lighten</option><option value="darken">Darken</option><option value="color-dodge">Color dodge</option><option value="hue">Hue</option><option value="color">Color</option></select></div>
    <div id="g-ov"></div><div class="seg" id="ovf" style="margin-top:8px"></div></section>
  <section><h2>Color</h2><div id="g-color"></div></section>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var S0={mirror:'off',mc:1,mcm:'sq',ovs:100,ovf:'n',kal:0,kr:0,pos:50,blocks:0,bs:32,smear:0,sd:'h',trails:0,td:10,ta:0,pix:0,wave:0,post:0,noise:0,scan:0,inv:'n',ovop:50,blend:'source-over',hue:0,sat:100,op:100,seed:1};
var S=Object.assign({},S0);
var hist=[JSON.stringify(S)],src=null,ov=null,cmp=false,dl=null,pend=false;
var cv=$('#cv'),cx=cv.getContext('2d'),wc=document.createElement('canvas'),wx=wc.getContext('2d',{willReadFrequently:true}),tc=document.createElement('canvas'),tx=tc.getContext('2d'),pc=document.createElement('canvas'),pcx=pc.getContext('2d');
var MODES=[['off','Off'],['oi','Out → In: sides'],['ov','Out → In: top/bottom'],['oq','Out → In: all four']];
var SL={
 'g-mirror':[['Mirror copies (1 = single mirror)','mc',1,8,'×'],['Fold line distance from edge','pos',10,150,'%']],
 'g-kal':[['Kaleidoscope segments (0 = off)','kal',0,16,''],['Kaleidoscope rotation','kr',0,360,'°']],
 'g-mosh':[['Block displacement','blocks',0,100,'%'],['Block size','bs',8,128,'px'],['Pixel smear / drag','smear',0,100,'%']],
 'g-mosh2':[['Ghost trails','trails',0,12,''],['Trail distance','td',0,50,'%'],['Trail angle','ta',0,360,'°']],
 'g-fx':[['Pixelate','pix',0,60,'px'],['Wave warp','wave',0,100,'%'],['Posterize levels (0 = off)','post',0,8,''],['Noise / grain','noise',0,100,'%'],['Scanlines','scan',0,100,'%']],
 'g-ov':[['Overlay opacity','ovop',0,100,'%'],['Overlay size','ovs',25,300,'%']],
 'g-color':[['Hue','hue',0,360,'°'],['Saturation','sat',0,300,'%'],['Opacity','op',0,100,'%']]
};
var sliders={},btns={};
Object.keys(SL).forEach(function(g){SL[g].forEach(function(d){
 var r=document.createElement('div');r.className='row';
 r.innerHTML='<label><span>'+d[0]+'</span><b></b></label><div class="trk"><div class="fill"></div><div class="thumb" tabindex="0" role="slider"></div></div>';
 $('#'+g).appendChild(r);
 var k=d[1],mn=d[2],mx=d[3],b=r.querySelector('b'),trk=r.querySelector('.trk'),fill=r.querySelector('.fill'),th=r.querySelector('.thumb'),sx=null,sv=0,tw=1;
 function set(v){v=Math.max(mn,Math.min(mx,Math.round(v)));var p=(v-mn)/(mx-mn);th.style.left='calc((100% - 36px) * '+p+')';fill.style.width='calc((100% - 36px) * '+p+' + 18px)';b.textContent=v+d[4];th.setAttribute('aria-valuenow',v);return v}
 th.addEventListener('pointerdown',function(e){e.preventDefault();try{th.setPointerCapture(e.pointerId)}catch(x){}sx=e.clientX;sv=S[k];tw=Math.max(1,trk.clientWidth-36);th.classList.add('act')});
 th.addEventListener('pointermove',function(e){if(sx===null)return;S[k]=set(sv+(e.clientX-sx)/tw*(mx-mn));draw()});
 function end(){if(sx===null)return;sx=null;th.classList.remove('act');push()}
 th.addEventListener('pointerup',end);th.addEventListener('pointercancel',end);
 th.addEventListener('keydown',function(e){var st=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:(e.key==='ArrowLeft'||e.key==='ArrowDown')?-1:0;if(!st)return;e.preventDefault();S[k]=set(S[k]+st*(e.shiftKey?10:1));draw();push()});

})});
function seg(id,list,key){list.forEach(function(m){
 var b=document.createElement('button');b.textContent=m[1];b.onclick=function(){S[key]=m[0];sync();draw();push()};
 $('#'+id).appendChild(b);(btns[key]=btns[key]||{})[m[0]]=b})}
seg('mirror',MODES,'mirror');
seg('sd',[['h','Smear sideways'],['v','Smear downward']],'sd');
seg('inv',[['n','Normal colors'],['i','Invert colors']],'inv');
seg('mcm',[['sq','Squeeze copies'],['cr','Crop copies (keep proportions)']],'mcm');
seg('ovf',[['n','Overlay normal'],['f','Flip overlay']],'ovf');
function sync(){
 for(var k in sliders)sliders[k].set(S[k]);
 for(var key in btns)for(var v in btns[key])btns[key][v].className=S[key]===v?'on':'';
 $('#blend').value=S.blend;
 $('#undo').disabled=hist.length<2;
}
function push(){var j=JSON.stringify(S);if(j===hist[hist.length-1])return;hist.push(j);if(hist.length>60)hist.shift();sync()}
$('#undo').onclick=function(){if(hist.length<2)return;hist.pop();S=JSON.parse(hist[hist.length-1]);sync();draw()};
$('#reset').onclick=function(){S=Object.assign({},S0);sync();draw();push()};
$('#shuffle').onclick=function(){S.seed=(Math.random()*1e6)|0;draw();push()};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function snap(W,H){tc.width=W;tc.height=H;tx.drawImage(wc,0,0)}
function draw(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;render()})}
function render(){
 if(!src)return;
 if(cmp){cv.width=wc.width;cv.height=wc.height;cx.clearRect(0,0,cv.width,cv.height);cx.drawImage(src,0,0,cv.width,cv.height);return}
 var W=wc.width,H=wc.height,L=S.pos/100,m=S.mirror;
 wx.globalAlpha=1;wx.clearRect(0,0,W,H);wx.drawImage(src,0,0,W,H);
 function mh(right){snap(W,H);wx.save();wx.beginPath();if(right)wx.rect(L*W,0,W,H);else wx.rect(0,0,L*W,H);wx.clip();wx.translate(2*L*W,0);wx.scale(-1,1);wx.drawImage(tc,0,0);wx.restore()}
 function mv(bot){snap(W,H);wx.save();wx.beginPath();if(bot)wx.rect(0,L*H,W,H);else wx.rect(0,0,W,L*H);wx.clip();wx.translate(0,2*L*H);wx.scale(1,-1);wx.drawImage(tc,0,0);wx.restore()}
 function fh(){var a=S.pos/100*.25;snap(W,H);wx.save();wx.beginPath();wx.rect(a*W,0,a*W,H);wx.clip();wx.translate(2*a*W,0);wx.scale(-1,1);wx.drawImage(tc,0,0);wx.restore();wx.save();wx.beginPath();wx.rect((1-2*a)*W,0,a*W,H);wx.clip();wx.translate(2*(1-a)*W,0);wx.scale(-1,1);wx.drawImage(tc,0,0);wx.restore()}
 function fv(){var a=S.pos/100*.25;snap(W,H);wx.save();wx.beginPath();wx.rect(0,a*H,W,a*H);wx.clip();wx.translate(0,2*a*H);wx.scale(1,-1);wx.drawImage(tc,0,0);wx.restore();wx.save();wx.beginPath();wx.rect(0,(1-2*a)*H,W,a*H);wx.clip();wx.translate(0,2*(1-a)*H);wx.scale(1,-1);wx.drawImage(tc,0,0);wx.restore()}
 if(m==='oi')fh();else if(m==='ov')fv();else if(m==='oq'){fh();fv()}
 if(m!=='off'&&S.mc>1){var N=S.mc,hx=(m==='oi'||m==='oq'),vy=(m==='ov'||m==='oq');
  snap(W,H);wx.clearRect(0,0,W,H);
  var cw=hx?W/N:W,ch=vy?H/N:H;var cr=S.mcm==='cr',qx=cr&&hx?(W-cw)/2:0,qy=cr&&vy?(H-ch)/2:0,qw=cr&&hx?cw:W,qh=cr&&vy?ch:H;
  for(var ti=0;ti<(hx?N:1);ti++)for(var tj=0;tj<(vy?N:1);tj++){
   wx.save();wx.translate(ti%2?(ti+1)*cw:ti*cw,tj%2?(tj+1)*ch:tj*ch);wx.scale(ti%2?-1:1,tj%2?-1:1);wx.drawImage(tc,qx,qy,qw,qh,0,0,cw,ch);wx.restore()}}
 var i,x,y;
 if(S.kal>=2){
  var KN=S.kal,wd=6.2831853/KN,hw=wd/2,ro=S.kr*Math.PI/180,id3=wx.getImageData(0,0,W,H),s32=new Uint32Array(id3.data.buffer),o32=new Uint32Array(s32.length),c0=W/2,d0=H/2;
  var rf=function(v,m){v=Math.abs(v);var q=v%(2*m);return q>m?2*m-q:q};
  for(y=0;y<H;y++)for(x=0;x<W;x++){
   var ex=x-c0,ey=y-d0,rr=Math.sqrt(ex*ex+ey*ey),mm=((Math.atan2(ey,ex)%wd)+wd)%wd;if(mm>hw)mm=wd-mm;
   var aa=mm+ro,u=rf(c0+rr*Math.cos(aa),W-1),v2=rf(d0+rr*Math.sin(aa),H-1);

 }

  snap(W,H);var B=S.bs,r=rng(S.seed),a=S.blocks/100,ms=B*(1+4*a);

   if(r()<a*.6){
    var bw=Math.min(B,W-bx),bh=Math.min(B,H-by);
    var sx=Math.max(0,Math.min(W-bw,Math.round(bx+(r()-.5)*2*ms))),sy=Math.max(0,Math.min(H-bh,Math.round(by+(r()-.5)*ms*.4)));

   else{r();r();r()}}
 }

   }else{

    for(var xx=x;xx<Math.min(W,x+tw);xx++){p=d[y0*W+xx];for(y=y0;y<e;y++)d[y*W+xx]=p}
   }}
  wx.putImageData(id,0,0);
 }
 if(S.trails>0){
  snap(W,H);var nt=S.trails,st=S.td/100*W/nt,an=S.ta*Math.PI/180,dx=Math.cos(an)*st,dy=Math.sin(an)*st;

 }
 if(S.pix>=2){var ps=S.pix,pw=Math.ceil(W/ps),ph2=Math.ceil(H/ps);pc.width=pw;pc.height=ph2;pcx.drawImage(wc,0,0,pw,ph2);wx.clearRect(0,0,W,H);wx.imageSmoothingEnabled=false;wx.drawImage(pc,0,0,pw,ph2,0,0,pw*ps,ph2*ps);wx.imageSmoothingEnabled=true}

 if(pl||nz||iv){var id2=wx.getImageData(0,0,W,H),a2=id2.data,q2=rng(S.seed+3),stp=255/Math.max(1,S.post-1),na=S.noise*2.55;
  for(i=0;i<a2.length;i+=4){var nv=nz?(q2()-.5)*na:0;for(var c=0;c<3;c++){var v=a2[i+c];if(pl)v=Math.round(v/stp)*stp;v+=nv;if(iv)v=255-v;a2[i+c]=v}}
  wx.putImageData(id2,0,0)}

 if(ov){var ow=ov.width,oh=ov.height,kk=Math.max(W/ow,H/oh)*S.ovs/100,dw=ow*kk,dh=oh*kk;wx.save();wx.globalAlpha=S.ovop/100;wx.globalCompositeOperation=S.blend;if(S.ovf==='f'){wx.translate(W,0);wx.scale(-1,1)}wx.drawImage(ov,(W-dw)/2,(H-dh)/2,dw,dh);wx.restore()}

 cx.filter='hue-rotate('+S.hue+'deg) saturate('+S.sat+'%)';
 cx.globalAlpha=S.op/100;cx.drawImage(wc,0,0);cx.filter='none';cx.globalAlpha=1;
}
function load(bmp){
 var M=1600,k=Math.min(1,M/Math.max(bmp.width,bmp.height));
 src=bmp;wc.width=Math.round(bmp.width*k);wc.height=Math.round(bmp.height*k);
 $('#empty').hidden=true;cv.hidden=false;render();
}
function note(t){$('#msg').textContent=t;if(!src)$('#empty').textContent=t}
$('#file').addEventListener('change',function(e){
 var inp=e.target,f=inp.files&&inp.files[0];if(!f)return;
 note('Loading photo…');
 function done(){inp.value=''}
 function ok(b){try{S=Object.assign({},S0);hist=[JSON.stringify(S)];ov=null;sync();load(b);$('#msg').textContent=''}catch(er){note('Couldn’t show that photo: '+er.message)}done()}
 function fail(){note('Couldn’t open that photo. Try a different one.');done()}
 function viaImg(){var fr=new FileReader();fr.onerror=fail;fr.onload=function(){var im=new Image();im.onerror=fail;im.onload=function(){ok(im)};im.src=fr.result};fr.readAsDataURL(f)}
 if(window.createImageBitmap)createImageBitmap(f).then(ok,viaImg);else viaImg();
});
$('#file2').addEventListener('change',function(e){var inp=e.target,f=inp.files&&inp.files[0];if(!f)return;
 function ok(b){ov=b;$('#msg').textContent='';draw();inp.value=''}
 function fail(){$('#msg').textContent='Couldn’t open that overlay photo.';inp.value=''}
 function viaImg(){var fr=new FileReader();fr.onerror=fail;fr.onload=function(){var im=new Image();im.onerror=fail;im.onload=function(){ok(im)};im.src=fr.result};fr.readAsDataURL(f)}
 if(window.createImageBitmap)createImageBitmap(f).then(ok,viaImg);else viaImg()});
$('#rmov').onclick=function(){ov=null;draw()};
$('#blend').onchange=function(){S.blend=this.value;draw();push()};
$('#rand').onclick=function(){
 var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},C=function(p){return Math.random()<p},m=['off','oi','ov','oq'][R(0,3)];
 Object.assign(S,{mirror:m,mc:m==='off'?1:R(1,5),pos:R(15,110),kal:C(.4)?R(2,10):0,kr:R(0,360),blocks:C(.5)?R(10,60):0,bs:R(12,64),smear:C(.4)?R(5,50):0,sd:C(.5)?'h':'v',trails:C(.35)?R(2,6):0,td:R(5,25),ta:R(0,360),pix:C(.2)?R(4,20):0,wave:C(.3)?R(10,50):0,post:C(.15)?R(3,6):0,noise:C(.3)?R(5,30):0,scan:C(.25)?R(10,50):0,inv:C(.1)?'i':'n',hue:C(.6)?R(0,360):0,sat:R(80,200),seed:R(1,999999)});
 sync();draw();push()};
var cm=$('#cmp');
cm.addEventListener('pointerdown',function(e){e.preventDefault();try{cm.setPointerCapture(e.pointerId)}catch(x){}cmp=true;draw()});
['pointerup','pointercancel'].forEach(function(t){cm.addEventListener(t,function(){if(cmp){cmp=false;draw()}})});
cm.addEventListener('contextmenu',function(e){e.preventDefault()});
$('#save').onclick=function(){
 var msg=$('#msg');
 if(!src){msg.textContent='Choose a photo first.';return}
 function fbk(why){$('#fb').src=cv.toDataURL('image/png');$('#fbx').hidden=false;msg.textContent=why+' Press and hold the image below, then choose Download image.';$('#fbx').scrollIntoView()}
 if(!dl){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='glitch-'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();msg.textContent='Saved. Check your Downloads folder.'},'image/png');return}
 cv.toBlob(function(b){
  dl.save({filename:'glitch-'+Date.now()+'.png',data:b}).then(function(){msg.textContent='Saved.'},function(er){if(er&&er.code==='declined')msg.textContent='Save cancelled.';else fbk('Save failed ('+((er&&er.code)||'unknown')+').')});
 },'image/png');
};
try{if(window.claude&&claude.use)claude.use('downloads').then(function(d){dl=d},function(){})}catch(e){}
sync();
})();
</script>
